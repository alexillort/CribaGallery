name: Compilar Criba

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: gradle :androidApp:assembleRelease --stacktrace
      - name: Preparar archivo
        run: cp androidApp/build/outputs/apk/release/androidApp-release.apk Criba-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Criba-android.apk

  windows:
    name: Windows (instalador)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar instalador
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          PACKAGE_VERSION: 1.0.${{ github.run_number }}
        run: gradle :desktopApp:packageMsi --stacktrace
      - name: Preparar archivo
        run: cp desktopApp/build/compose/binaries/main/msi/*.msi Criba-windows.msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Criba-windows.msi

  publicar:
    name: Publicar en Releases
    needs: [android, windows]
    if: ${{ always() && (needs.android.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: salida
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Criba 1.0.${{ github.run_number }}
          body: |
            **Android:** descarga `Criba-android.apk` desde el celular e instálalo.
            **Windows:** descarga `Criba-windows.msi` y ábrelo.
          files: salida/*
